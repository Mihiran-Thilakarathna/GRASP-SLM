name: CI

on:
  push:
  pull_request:

jobs:
  java:
    name: Java app (Maven + JUnit 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: grasp-slm-jar
          path: app/target/grasp-slm.jar

  python:
    name: Python pipeline (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "jsonschema>=4.21" "pytest>=8"
      - run: pytest -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4
      # Only the build stage: the full image downloads ~2.5 GB of models.
      - run: docker build --target build -t grasp-slm-build .
